<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>小分队分账 💸</title>
  <style>
    @font-face {
      font-family: 'Noto Sans SC';
      src: local('PingFang SC'), local('Microsoft YaHei'), local('Helvetica Neue');
    }
  </style>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }

    :root {
      --font: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      --bg: #0C0C10;
      --surface: #141418;
      --surface2: #1C1C22;
      --border: rgba(255,255,255,0.08);
      --accent: #C8F060;
      --accent2: #60C8F0;
      --accent3: #F060A8;
      --text: #F0F0F0;
      --muted: #666;
      --dan: #FF6B6B;
      --li: #4ECDC4;
      --ruan: #FFE66D;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overscroll-behavior: none;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* ── NOISE TEXTURE ── */
    #app::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.5;
    }

    /* ── SYNC BAR ── */
    .sync-bar {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      max-width: 430px; width: 100%; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; padding: 7px 16px; font-size: 12px; font-weight: 600;
      transition: all 0.3s; font-family: var(--font);
      letter-spacing: 0.03em;
    }
    .sync-bar.loading { background: #1a1a22; color: #555; }
    .sync-bar.saving  { background: #2a2400; color: #FFE66D; border-bottom: 1px solid #FFE66D44; }
    .sync-bar.saved   { background: #0a2214; color: var(--accent); border-bottom: 1px solid var(--accent)44; }
    .sync-bar.synced  { background: #0a1a2a; color: var(--accent2); border-bottom: 1px solid var(--accent2)44; }
    .sync-bar.error   { background: #2a0a0a; color: #FF6B6B; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 1s linear infinite; }

    /* ── HEADER ── */
    .header {
      padding: 56px 24px 0;
      position: relative; z-index: 1;
    }
    .header-eyebrow {
      font-family: var(--font);
      font-size: 11px; letter-spacing: 0.15em; color: var(--muted);
      text-transform: uppercase; margin-bottom: 6px;
    }
    .header-title {
      font-family: var(--font);
      font-size: 28px; font-weight: 800; line-height: 1;
      letter-spacing: -0.03em;
    }
    .header-title span { color: var(--accent); }

    /* ── BALANCE STRIP ── */
    .balance-strip {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin: 20px 24px 0;
      position: relative; z-index: 1;
      overflow-x: auto;
    }
    .balance-card {
      border-radius: 16px; padding: 14px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      position: relative; overflow: hidden;
      transition: transform 0.15s;
      min-width: 112px;
    }
    .balance-card::before {
      content: '';
      position: absolute; top: -30px; right: -20px;
      width: 80px; height: 80px; border-radius: 50%;
      opacity: 0.12;
    }
    .balance-card.dan::before { background: var(--dan); }
    .balance-card.li::before  { background: var(--li); }
    .balance-card.ruan::before{ background: var(--ruan); }
    .balance-avatar { font-size: 22px; }
    .balance-name { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; }
    .balance-amt {
      font-family: var(--font);
      font-size: 18px; font-weight: 800; margin-top: 6px; line-height: 1;
    }
    .balance-amt.positive { color: var(--accent); }
    .balance-amt.negative { color: #FF6B6B; }
    .balance-amt.zero     { color: var(--muted); }
    .balance-label { font-size: 10px; color: var(--muted); margin-top: 3px; }

    /* ── NAV ── */
    .nav {
      display: flex; gap: 4px;
      margin: 20px 24px 0;
      background: var(--surface);
      border-radius: 14px; padding: 4px;
      position: relative; z-index: 1;
      border: 1px solid var(--border);
    }
    .nav-btn {
      flex: 1; background: transparent; border: none;
      border-radius: 10px; padding: 9px 4px;
      cursor: pointer; color: var(--muted);
      font-size: 11px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      transition: all 0.2s; font-family: var(--font);
    }
    .nav-btn.active {
      background: var(--surface2);
      color: var(--text);
    }
    .nav-icon { font-size: 15px; }

    /* ── BOOK SWITCHER ── */
    .book-switcher {
      margin: 16px 24px 0;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(200,240,96,0.09), rgba(96,200,240,0.06));
      border-radius: 16px;
      padding: 12px 14px;
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      cursor: pointer;
    }
    .book-label { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
    .book-name { font-size: 16px; font-weight: 800; margin-top: 3px; }
    .book-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .book-action {
      width: 36px; height: 36px; border-radius: 12px;
      border: 1px solid rgba(200,240,96,0.25);
      background: rgba(200,240,96,0.10);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }

    /* ── CONTENT ── */
    .content { padding: 16px 24px 100px; position: relative; z-index: 1; }

    /* ── SECTION TITLE ── */
    .section-title {
      font-family: var(--font);
      font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ── ADD BILL FORM ── */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 20px;
      margin-bottom: 20px;
    }
    .form-title {
      font-family: var(--font);
      font-size: 16px; font-weight: 800;
      margin-bottom: 16px; letter-spacing: -0.02em;
    }
    .form-row { margin-bottom: 14px; }
    .form-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.05em; }
    .form-input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; color: var(--text); font-size: 15px;
      font-family: var(--font); outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input.amount-input {
      font-family: var(--font);
      font-size: 22px; font-weight: 700;
    }

    .compact-input-row {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
    }
    .mini-btn {
      min-height: 42px; border-radius: 12px; padding: 0 14px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-size: 12px; font-weight: 800;
      font-family: var(--font); cursor: pointer;
    }
    .mini-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
    .mini-btn.danger { color: #FF9999; background: rgba(255,107,107,0.06); }
    .mini-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .book-list { display: grid; gap: 8px; margin-bottom: 18px; }
    .book-row {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--border); background: var(--surface2);
      border-radius: 14px; padding: 12px; cursor: pointer;
    }
    .book-row.active { border-color: var(--accent); background: rgba(200,240,96,0.08); }
    .book-row-main { flex: 1; min-width: 0; }
    .book-row-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-row-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .book-row-check { font-size: 16px; color: var(--accent); width: 18px; text-align: center; }
    .member-editor-row {
      display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .member-editor-row:last-child { border-bottom: none; }
    .avatar-input { text-align: center; padding-left: 6px; padding-right: 6px; font-size: 19px; }
    .avatar-picks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .avatar-pick {
      width: 32px; height: 32px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px;
    }
    .import-textarea {
      width: 100%; min-height: 92px; resize: vertical;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text);
      padding: 12px 14px; font-family: var(--font);
      font-size: 12px; line-height: 1.5; outline: none;
    }
    .import-textarea:focus { border-color: var(--accent2); }

    /* Category pills */
    .cat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-pill {
      padding: 6px 14px; border-radius: 20px; font-size: 12px;
      font-weight: 600; cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted); transition: all 0.15s;
    }
    .cat-pill.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Payer select */
    .payer-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .payer-btn {
      border-radius: 12px; padding: 10px 8px; text-align: center;
      cursor: pointer; border: 1.5px solid var(--border);
      background: var(--surface2); transition: all 0.15s;
    }
    .payer-btn.active { border-color: var(--accent); background: rgba(200,240,96,0.1); }
    .payer-btn-avatar { font-size: 20px; }
    .payer-btn-name { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .payer-btn.active .payer-btn-name { color: var(--accent); }

    /* Split mode */
    .split-toggle {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .split-btn {
      border-radius: 10px; padding: 9px; text-align: center;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); font-size: 12px; font-weight: 600;
      color: var(--muted); transition: all 0.15s;
    }
    .split-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(96,200,240,0.08); }

    /* Participant checkboxes */
    .participant-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .participant-row:last-child { border-bottom: none; }
    .participant-left { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
    .participant-check {
      width: 22px; height: 22px; border-radius: 8px;
      border: 1.5px solid var(--border); background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: all 0.15s; font-size: 13px;
    }
    .participant-check.checked { background: var(--accent); border-color: var(--accent); color: #000; }
    .participant-custom-amt {
      width: 80px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; color: var(--text);
      font-size: 14px; font-family: var(--font); font-weight: 600;
      outline: none; text-align: right;
    }
    .participant-custom-amt:focus { border-color: var(--accent2); }
    .participant-share { font-family: var(--font); font-size: 14px; font-weight: 700; color: var(--accent); }

    /* Submit btn */
    .submit-btn {
      width: 100%; padding: 14px; border-radius: 14px;
      background: var(--accent); color: #000; border: none;
      font-size: 15px; font-weight: 800; cursor: pointer;
      font-family: var(--font); letter-spacing: 0.02em;
      transition: all 0.15s; margin-top: 4px;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }

    /* ── BILL LIST ── */
    .bill-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 14px 16px;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 12px;
      animation: slideIn 0.25s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .bill-cat-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .bill-info { flex: 1; min-width: 0; }
    .bill-desc { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bill-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .bill-right { text-align: right; flex-shrink: 0; }
    .bill-amt {
      font-family: var(--font);
      font-size: 16px; font-weight: 800;
    }
    .bill-payer { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .bill-delete {
      width: 28px; height: 28px; border-radius: 8px;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .bill-delete:active { background: rgba(255,80,80,0.2); border-color: #FF6B6B; color: #FF6B6B; }

    /* ── SETTLE UP ── */
    .settle-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 16px;
      margin-bottom: 10px;
    }
    .settle-arrow {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600;
    }
    .settle-name { padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; }
    .settle-amt {
      font-family: var(--font);
      font-size: 20px; font-weight: 800; color: var(--accent);
      margin: 8px 0 4px; letter-spacing: -0.02em;
    }
    .settle-btn {
      padding: 8px 16px; border-radius: 10px;
      background: rgba(200,240,96,0.12); border: 1px solid rgba(200,240,96,0.3);
      color: var(--accent); font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: var(--font);
      transition: all 0.15s; margin-top: 8px;
    }
    .settle-btn:active { background: rgba(200,240,96,0.25); }
    .settled-log {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--muted);
    }
    .settled-log:last-child { border-bottom: none; }

    /* ── STATS ── */
    .stat-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 16px 18px;
      margin-bottom: 10px;
    }
    .stat-member-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .stat-bar-row { margin-bottom: 8px; }
    .stat-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--muted); }
    .stat-bar-track { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--accent);
      color: var(--accent); border-radius: 12px; padding: 10px 20px;
      font-size: 13px; font-weight: 700; z-index: 2000;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
      white-space: nowrap;
      font-family: var(--font);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center; padding: 40px 20px; color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-sheet {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      border: 1px solid var(--border);
      padding: 24px 24px 40px;
      width: 100%; max-width: 430px;
      animation: sheetUp 0.35s cubic-bezier(0.34,1.2,0.64,1);
      max-height: 90vh; overflow-y: auto;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle {
      width: 40px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 20px;
    }
    .drawer-overlay {
      position: fixed; inset: 0; z-index: 700;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(5px);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .drawer-sheet {
      width: 100%; max-width: 430px;
      max-height: 82vh; overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 12px 20px 28px;
      animation: sheetUp 0.28s cubic-bezier(0.34,1.05,0.64,1);
      box-shadow: 0 -18px 60px rgba(0,0,0,0.45);
    }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 14px;
    }
    .drawer-title { font-size: 17px; font-weight: 800; }
    .drawer-close {
      width: 34px; height: 34px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--muted); font-size: 18px; cursor: pointer;
    }
    .drawer-list { max-height: 42vh; overflow-y: auto; display: grid; gap: 8px; margin-bottom: 16px; }

    /* ── CALCULATOR ── */
    .calc-display {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; color: var(--text);
      font-family: var(--font); outline: none;
      transition: border-color 0.2s;
      min-height: 58px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .calc-display.has-expr { border-color: var(--accent2); }
    .calc-expr {
      font-size: 13px; color: var(--accent2); font-weight: 600;
      letter-spacing: 0.02em; min-height: 18px;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .calc-expr-chip {
      background: rgba(96,200,240,0.12); border: 1px solid rgba(96,200,240,0.25);
      border-radius: 6px; padding: 1px 7px; font-size: 12px;
    }
    .calc-expr-chip.active {
      background: rgba(200,240,96,0.1); border-color: rgba(200,240,96,0.35); color: var(--accent);
    }
    .calc-op-sym {
      color: var(--accent2); font-size: 14px; font-weight: 800; padding: 0 2px;
    }
    .calc-result {
      font-size: 26px; font-weight: 800; line-height: 1.1;
      font-family: var(--font);
    }
    .calc-result.zero { color: var(--muted); }
    .calc-result.has-val { color: var(--text); }
    .calc-keypad {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-top: 10px;
    }
    .calc-key {
      border-radius: 12px; padding: 14px 4px;
      text-align: center; cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      font-size: 17px; font-weight: 700;
      color: var(--text); transition: all 0.1s;
      user-select: none; font-family: var(--font);
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .calc-key:active { transform: scale(0.94); background: var(--surface); }
    .calc-key.op { color: var(--accent2); background: rgba(96,200,240,0.06); }
    .calc-key.op:active { background: rgba(96,200,240,0.18); }
    .calc-key.del { color: #FF9999; font-size: 19px; }
    .calc-key.confirm {
      grid-column: span 3;
      background: var(--accent); color: #000;
      border-color: var(--accent); font-size: 15px;
    }
    .calc-key.confirm:active { background: #a8d040; }
    .calc-key.clear { color: var(--dan); background: rgba(255,107,107,0.06); }
    .calc-key.clear:active { background: rgba(255,107,107,0.18); }

    /* Loading */
    .loading-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 80vh; gap: 16px;
    }
    .loading-icon { font-size: 52px; animation: pulse 1.5s ease infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ===== DEFAULTS =====
const DEFAULT_MEMBERS = [
  { id: "dan",  name: "蛋总", avatar: "🥚", color: "var(--dan)"  },
  { id: "li",   name: "丽总", avatar: "🦦", color: "var(--li)"   },
  { id: "ruan", name: "小阮", avatar: "🌼", color: "var(--ruan)" },
];

const MEMBER_COLORS = [
  "var(--dan)", "var(--li)", "var(--ruan)", "var(--accent)",
  "var(--accent2)", "var(--accent3)", "#A78BFA", "#F59E0B",
];

const AVATAR_PRESETS = ["🥚","🦦","🌼","🐰","🐱","🐶","🐼","🦊","🍄","🌙","⭐","🍜","🧋","🚗"];

const CATS = [
  { id: "food",  label: "🍜 吃饭", bg: "rgba(255,107,107,0.15)" },
  { id: "drink", label: "🧋 奶茶", bg: "rgba(255,230,109,0.15)" },
  { id: "car",   label: "🚗 打车", bg: "rgba(78,205,196,0.15)"  },
  { id: "shop",  label: "🛍️ 购物", bg: "rgba(167,139,250,0.15)" },
  { id: "other", label: "📦 其他", bg: "rgba(200,200,200,0.1)"  },
];

const CAT_MAP = Object.fromEntries(CATS.map(c => [c.id, c]));

const LEGACY_DB_PATH = "squad_aa_v1";
const DB_PATH = "squad_aa_books_v2";
let _isSaving = false;

// ===== STATE =====
function defaultState() {
  const book = makeBook("默认账本", DEFAULT_MEMBERS);
  return { version: 2, activeBookId: book.id, books: { [book.id]: book }, legacyV1ImportedAt: null };
}

let state = defaultState();
let ui = {
  tab: "add",           // add | bills | settle | stats
  syncStatus: "loading",
  toast: null,
  bookDrawerOpen: false,
  // form
  form: makeForm(DEFAULT_MEMBERS),
  bookForm: {
    name: "",
    rename: "",
    memberName: "",
    memberAvatar: "",
    importJson: "",
  },
  memberDrafts: {},
  skipBookInputSync: false,
  // calculator
  calc: {
    tokens: [],   // list of {type:'num'|'op', val} e.g. [{type:'num',val:100},{type:'op',val:'+'},{type:'num',val:30}]
    current: "",  // current number being typed
  },
};

function cloneMembers(members = DEFAULT_MEMBERS) {
  return members.map((m, i) => ({
    id: m.id || genId(),
    name: m.name || `成员${i + 1}`,
    avatar: m.avatar || AVATAR_PRESETS[i % AVATAR_PRESETS.length],
    color: m.color || MEMBER_COLORS[i % MEMBER_COLORS.length],
  }));
}

function makeBook(name, members = DEFAULT_MEMBERS) {
  const id = genId();
  return {
    id,
    name: (name || "新账本").trim(),
    members: cloneMembers(members),
    bills: [],
    settled: [],
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
}

function makeForm(members = DEFAULT_MEMBERS) {
  const ms = members.length ? members : DEFAULT_MEMBERS;
  return {
    desc: "",
    amount: "",
    cat: "food",
    payer: ms[0].id,
    splitMode: "equal",
    participants: Object.fromEntries(ms.map(m => [m.id, true])),
    customAmts: Object.fromEntries(ms.map(m => [m.id, ""])),
  };
}

function normalizeBook(book, fallbackName = "默认账本") {
  const members = cloneMembers(book?.members?.length ? book.members : DEFAULT_MEMBERS);
  return {
    id: book?.id || genId(),
    name: (book?.name || fallbackName).trim(),
    members,
    bills: Array.isArray(book?.bills) ? book.bills : [],
    settled: Array.isArray(book?.settled) ? book.settled : [],
    createdAt: book?.createdAt || Date.now(),
    updatedAt: book?.updatedAt || book?._updatedAt || Date.now(),
  };
}

function migrateLegacyState(raw) {
  const book = normalizeBook({
    id: "book_default",
    name: "默认账本",
    members: DEFAULT_MEMBERS,
    bills: raw?.bills || [],
    settled: raw?.settled || [],
    updatedAt: raw?._updatedAt,
  });
  return { version: 2, activeBookId: book.id, books: { [book.id]: book }, legacyV1ImportedAt: legacyHasData(raw) ? Date.now() : null, _needsSave: legacyHasData(raw) };
}

function normalizeState(raw) {
  if (!raw) return defaultState();
  if (raw.books) {
    const books = {};
    Object.values(raw.books).forEach((b, i) => {
      const book = normalizeBook(b, i === 0 ? "默认账本" : "新账本");
      books[book.id] = book;
    });
    if (!Object.keys(books).length) return defaultState();
    const activeBookId = books[raw.activeBookId]?.id || Object.keys(books)[0];
    return {
      version: 2,
      activeBookId,
      books,
      legacyV1ImportedAt: raw.legacyV1ImportedAt || null,
    };
  }
  return migrateLegacyState(raw);
}

function legacyHasData(raw) {
  return !!raw && ((Array.isArray(raw.bills) && raw.bills.length > 0) || (Array.isArray(raw.settled) && raw.settled.length > 0));
}

function mergeLegacyIntoState(current, legacyRaw) {
  const next = normalizeState(current);
  const hasAnyCurrentData = Object.values(next.books).some(book => book.bills.length > 0 || book.settled.length > 0);
  if (!legacyHasData(legacyRaw) || (next.legacyV1ImportedAt && hasAnyCurrentData)) return next;
  return mergeLegacyIntoStateForced(next, legacyRaw);
}

function mergeLegacyIntoStateForced(current, legacyRaw) {
  const next = normalizeState(current);
  if (!legacyHasData(legacyRaw)) return next;

  const legacyBook = normalizeBook({
    id: "book_legacy_v1",
    name: "旧版账本",
    members: DEFAULT_MEMBERS,
    bills: legacyRaw.bills || [],
    settled: legacyRaw.settled || [],
    updatedAt: legacyRaw._updatedAt,
  });

  const books = Object.values(next.books);
  const onlyEmptyDefault = books.length === 1
    && books[0].bills.length === 0
    && books[0].settled.length === 0
    && books[0].members.length === DEFAULT_MEMBERS.length;

  if (onlyEmptyDefault) {
    legacyBook.id = books[0].id;
    legacyBook.name = books[0].name || "默认账本";
    next.books[legacyBook.id] = legacyBook;
    next.activeBookId = legacyBook.id;
  } else {
    const existingLegacyId = Object.keys(next.books).find(id => id === legacyBook.id || next.books[id].name === "旧版账本");
    if (existingLegacyId) {
      legacyBook.id = existingLegacyId;
    }
    next.books[legacyBook.id] = legacyBook;
    if (!next.books[next.activeBookId]?.bills?.length) next.activeBookId = legacyBook.id;
  }

  next.legacyV1ImportedAt = Date.now();
  next._needsSave = true;
  return next;
}

function getBooks() {
  state = normalizeState(state);
  return Object.values(state.books).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}

function activeBook() {
  state = normalizeState(state);
  if (!state.books[state.activeBookId]) {
    state.activeBookId = Object.keys(state.books)[0];
  }
  return state.books[state.activeBookId];
}

function getMembers() {
  return activeBook().members;
}

function rememberActiveBook() {
  try { localStorage.setItem("squad_aa_active_book", state.activeBookId); } catch {}
}

function ensureFormForBook() {
  const members = getMembers();
  const memberIds = new Set(members.map(m => m.id));
  if (!memberIds.has(ui.form.payer)) ui.form.payer = members[0]?.id || "";
  const nextParticipants = {};
  const nextCustomAmts = {};
  members.forEach(m => {
    nextParticipants[m.id] = ui.form.participants[m.id] ?? true;
    nextCustomAmts[m.id] = ui.form.customAmts[m.id] ?? "";
  });
  ui.form.participants = nextParticipants;
  ui.form.customAmts = nextCustomAmts;
}

function resetFormForBook() {
  ui.form = makeForm(getMembers());
  ui.calc = { tokens: [], current: "" };
  ui.memberDrafts = {};
}

// ===== FIREBASE =====
function saveState(s) {
  const nextState = normalizeState(s);
  try {
    localStorage.setItem("squad_aa_books", JSON.stringify(nextState));
    rememberActiveBook();
  } catch {}
  if (window._fb?.ready) {
    _isSaving = true;
    ui.syncStatus = "saving";
    render();
    window._fb.set(window._fb.ref(window._fb.db, DB_PATH), {
      ...nextState, _updatedAt: Date.now()
    }).then(() => {
      _isSaving = false;
      ui.syncStatus = "saved";
      render();
      setTimeout(() => { if (ui.syncStatus === "saved") { ui.syncStatus = "idle"; render(); } }, 2500);
    }).catch(() => {
      _isSaving = false;
      ui.syncStatus = "error";
      render();
    });
  }
}

function startRealtimeSync() {
  if (!window._fb?.ready) return;
  window._fb.onValue(window._fb.ref(window._fb.db, DB_PATH), (snap) => {
    if (_isSaving) return;
    if (snap.exists()) {
      state = normalizeState(snap.val());
      const savedActive = localStorage.getItem("squad_aa_active_book");
      if (savedActive && state.books[savedActive]) state.activeBookId = savedActive;
      ensureFormForBook();
      ui.syncStatus = "synced";
      render();
      setTimeout(() => { if (ui.syncStatus === "synced") { ui.syncStatus = "idle"; render(); } }, 2000);
    }
  });
}

async function loadFromFirebase() {
  if (window._fb?.ready) {
    try {
      const getWithTimeout = (path) => Promise.race([
        window._fb.get(window._fb.ref(window._fb.db, path)),
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 5000))
      ]);
      const snap = await getWithTimeout(DB_PATH);
      const current = snap.exists() ? normalizeState(snap.val()) : null;
      const legacySnap = await getWithTimeout(LEGACY_DB_PATH);
      if (legacySnap.exists()) {
        return current ? mergeLegacyIntoState(current, legacySnap.val()) : migrateLegacyState(legacySnap.val());
      }
      if (current) return current;
    } catch (e) {
      console.warn("Firebase load failed, using local:", e.message);
    }
  }
  try {
    const saved = JSON.parse(localStorage.getItem("squad_aa_books") || "null");
    const migrated = normalizeState(saved || JSON.parse(localStorage.getItem("squad_aa") || "null"));
    const savedActive = localStorage.getItem("squad_aa_active_book");
    if (savedActive && migrated.books[savedActive]) migrated.activeBookId = savedActive;
    return migrated;
  } catch { return defaultState(); }
}

// ===== HELPERS =====
function getToday() { return new Date().toLocaleDateString("zh-CN", { month:"numeric", day:"numeric" }); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function fmt(n) { return "¥" + Number(n).toFixed(2); }

// Compute net balances
function computeBalances() {
  const book = activeBook();
  const bal = Object.fromEntries(book.members.map(m => [m.id, 0]));
  book.bills.forEach(b => {
    // payer gets credited
    if (bal[b.payer] == null) bal[b.payer] = 0;
    bal[b.payer] += b.amount;
    // each participant owes their share
    Object.entries(b.splits).forEach(([id, amt]) => {
      if (bal[id] == null) bal[id] = 0;
      bal[id] -= amt;
    });
  });
  // apply settlements
  book.settled.forEach(s => {
    if (bal[s.from] == null) bal[s.from] = 0;
    if (bal[s.to] == null) bal[s.to] = 0;
    bal[s.from] += s.amount;
    bal[s.to]   -= s.amount;
  });
  return bal;
}

// Compute minimum transactions to settle
function computeSettlements(bal) {
  const debtors  = Object.entries(bal).filter(([,v]) => v < -0.01).map(([k,v]) => ({ id:k, amt:-v }));
  const creditors= Object.entries(bal).filter(([,v]) => v >  0.01).map(([k,v]) => ({ id:k, amt:v }));
  const txns = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    txns.push({ from: debtors[i].id, to: creditors[j].id, amount: Math.round(pay * 100) / 100 });
    debtors[i].amt  -= pay;
    creditors[j].amt -= pay;
    if (debtors[i].amt  < 0.01) i++;
    if (creditors[j].amt < 0.01) j++;
  }
  return txns;
}

function memberById(id) { return getMembers().find(m => m.id === id) || { id, name: "旧成员", avatar: "?" }; }

// ===== FORM LOGIC =====
function formSplits() {
  ensureFormForBook();
  const f = ui.form;
  const amt = parseFloat(f.amount) || (ui.calc.tokens.length > 0 || ui.calc.current ? calcTotal() : 0);
  const participants = Object.entries(f.participants).filter(([,v]) => v).map(([k]) => k);
  if (!participants.length) return {};
  if (f.splitMode === "equal") {
    const share = Math.round(amt / participants.length * 100) / 100;
    const splits = {};
    let total = 0;
    participants.forEach((id, i) => {
      if (i === participants.length - 1) {
        splits[id] = Math.round((amt - total) * 100) / 100;
      } else {
        splits[id] = share; total += share;
      }
    });
    return splits;
  } else {
    const splits = {};
    participants.forEach(id => {
      splits[id] = parseFloat(f.customAmts[id]) || 0;
    });
    return splits;
  }
}

function formValid() {
  ensureFormForBook();
  const f = ui.form;
  // allow pending calc state
  const amt = parseFloat(f.amount) || (ui.calc.tokens.length > 0 || ui.calc.current ? calcTotal() : 0);
  if (!f.desc.trim() || !amt || amt <= 0) return false;
  const participants = Object.values(f.participants).filter(Boolean).length;
  if (!participants) return false;
  if (f.splitMode === "custom") {
    const splits = formSplits();
    const total = Object.values(splits).reduce((s,v) => s+v, 0);
    if (Math.abs(total - amt) > 0.01) return false;
  }
  return true;
}

// ===== ACTIONS =====
// Sync live input values from DOM before any action that needs them
function syncInputsNow() {
  const descEl = document.getElementById("descInput");
  if (descEl) ui.form.desc = descEl.value;
  // amount is now managed via calculator state; sync if calc has pending input
  if (ui.calc.current !== "" || ui.calc.tokens.length > 0) {
    calcKey('confirm');
    return; // calcKey calls render internally
  }
}

function syncInputsAndAdd() {
  syncInputsNow();
  if (!formValid()) {
    // Show why it failed
    const f = ui.form;
    const amt = parseFloat(f.amount);
    if (!f.desc.trim()) { showToast("请填写描述"); return; }
    if (!amt || amt <= 0) { showToast("请填写金额"); return; }
    showToast("请检查分摊金额");
    return;
  }
  addBill();
}

function addBill() {
  // auto-confirm any pending calc
  if (ui.calc.tokens.length > 0 || ui.calc.current !== "") {
    const total = calcTotal();
    if (total > 0) {
      ui.form.amount = String(Math.round(total * 100) / 100);
      ui.calc.tokens = [];
      ui.calc.current = "";
    }
  }
  if (!formValid()) return;
  const book = activeBook();
  const f = ui.form;
  const splits = formSplits();
  const bill = {
    id: genId(),
    desc: f.desc.trim(),
    amount: parseFloat(f.amount),
    cat: f.cat,
    payer: f.payer,
    splits,
    date: getToday(),
    ts: Date.now(),
  };
  book.bills.push(bill);
  book.updatedAt = Date.now();
  saveState(state);
  // reset form
  ui.form = { ...ui.form, desc: "", amount: "" };
  ui.calc = { tokens: [], current: "" };
  showToast("✅ 记账成功！");
  setTimeout(() => { ui.tab = "bills"; render(); }, 300);
}

function deleteBill(id) {
  const book = activeBook();
  book.bills = book.bills.filter(b => b.id !== id);
  book.updatedAt = Date.now();
  saveState(state);
  showToast("🗑️ 已删除");
}

function settleUp(from, to, amount) {
  const book = activeBook();
  book.settled.push({ id: genId(), from, to, amount, date: getToday(), ts: Date.now() });
  book.updatedAt = Date.now();
  saveState(state);
  showToast(`💸 ${memberById(from).name} → ${memberById(to).name} ¥${amount.toFixed(2)}`);
}

function showToast(msg) {
  ui.toast = msg;
  render();
  setTimeout(() => { ui.toast = null; render(); }, 2200);
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function syncBookInputs() {
  const bookName = document.getElementById("newBookName");
  const rename = document.getElementById("renameBookInput");
  const memberName = document.getElementById("newMemberName");
  const memberAvatar = document.getElementById("newMemberAvatar");
  const importJson = document.getElementById("importLegacyJson");
  if (bookName) ui.bookForm.name = bookName.value;
  if (rename) ui.bookForm.rename = rename.value;
  if (memberName) ui.bookForm.memberName = memberName.value;
  if (memberAvatar) ui.bookForm.memberAvatar = memberAvatar.value;
  if (importJson) ui.bookForm.importJson = importJson.value;
}

function createBookFromInput() {
  syncBookInputs();
  const name = ui.bookForm.name.trim();
  if (!name) { showToast("请填写账本名"); return; }
  const book = makeBook(name, DEFAULT_MEMBERS);
  state.books[book.id] = book;
  state.activeBookId = book.id;
  ui.bookDrawerOpen = false;
  ui.bookForm.name = "";
  ui.bookForm.rename = book.name;
  ui.skipBookInputSync = true;
  resetFormForBook();
  rememberActiveBook();
  saveState(state);
  showToast("📒 已创建新账本");
}

function switchBook(id) {
  if (!state.books[id]) return;
  state.activeBookId = id;
  ui.bookForm.rename = activeBook().name;
  ui.bookDrawerOpen = false;
  resetFormForBook();
  rememberActiveBook();
  render();
}

function renameCurrentBook() {
  syncBookInputs();
  const book = activeBook();
  const name = ui.bookForm.rename.trim();
  if (!name) { showToast("账本名不能为空"); return; }
  book.name = name;
  book.updatedAt = Date.now();
  saveState(state);
  showToast("已重命名");
}

function deleteCurrentBook() {
  const books = getBooks();
  if (books.length <= 1) { showToast("至少保留一个账本"); return; }
  const book = activeBook();
  delete state.books[book.id];
  state.activeBookId = Object.keys(state.books)[0];
  ui.bookForm.rename = activeBook().name;
  resetFormForBook();
  rememberActiveBook();
  saveState(state);
  showToast("已删除账本");
}

function addMemberFromInput() {
  syncBookInputs();
  const name = ui.bookForm.memberName.trim();
  const avatar = ui.bookForm.memberAvatar.trim() || AVATAR_PRESETS[getMembers().length % AVATAR_PRESETS.length];
  if (!name) { showToast("请填写成员名"); return; }
  const book = activeBook();
  const member = { id: genId(), name, avatar, color: MEMBER_COLORS[book.members.length % MEMBER_COLORS.length] };
  book.members.push(member);
  ui.form.participants[member.id] = true;
  ui.form.customAmts[member.id] = "";
  ui.bookForm.memberName = "";
  ui.bookForm.memberAvatar = "";
  ui.skipBookInputSync = true;
  book.updatedAt = Date.now();
  saveState(state);
  showToast("已添加成员");
}

function updateMember(id, field, value) {
  const book = activeBook();
  const member = book.members.find(m => m.id === id);
  if (!member) return;
  const nextValue = value.trim() || member[field];
  delete ui.memberDrafts[`${id}:${field}`];
  if (member[field] === nextValue) {
    render();
    return;
  }
  member[field] = nextValue;
  book.updatedAt = Date.now();
  saveState(state);
}

function memberInUse(id) {
  const book = activeBook();
  return book.bills.some(b => b.payer === id || Object.prototype.hasOwnProperty.call(b.splits || {}, id))
    || book.settled.some(s => s.from === id || s.to === id);
}

function deleteMember(id) {
  const book = activeBook();
  if (book.members.length <= 1) { showToast("至少保留一个成员"); return; }
  if (memberInUse(id)) { showToast("这个成员已有账单，不能删除"); return; }
  book.members = book.members.filter(m => m.id !== id);
  delete ui.form.participants[id];
  delete ui.form.customAmts[id];
  delete ui.memberDrafts[`${id}:avatar`];
  delete ui.memberDrafts[`${id}:name`];
  if (ui.form.payer === id) ui.form.payer = book.members[0].id;
  book.updatedAt = Date.now();
  saveState(state);
  showToast("已删除成员");
}

async function restoreLegacyBook() {
  let legacyRaw = null;
  try {
    const localRaw = JSON.parse(localStorage.getItem("squad_aa") || "null");
    if (legacyHasData(localRaw)) legacyRaw = localRaw;
  } catch {}

  if (!legacyRaw && window._fb?.ready) {
    try {
      ui.syncStatus = "loading";
      render();
      const legacySnap = await Promise.race([
        window._fb.get(window._fb.ref(window._fb.db, LEGACY_DB_PATH)),
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 7000))
      ]);
      if (legacySnap.exists() && legacyHasData(legacySnap.val())) {
        legacyRaw = legacySnap.val();
      }
    } catch (e) {
      console.warn("Legacy restore failed:", e.message);
    }
  }

  if (!legacyRaw) {
    ui.syncStatus = "idle";
    render();
    showToast("没找到旧版数据");
    return;
  }

  state = mergeLegacyIntoStateForced(state, legacyRaw);
  delete state._needsSave;
  ensureFormForBook();
  ui.tab = "books";
  ui.syncStatus = "idle";
  saveState(state);
  showToast("已恢复旧版账本");
}

function importLegacyJson() {
  syncBookInputs();
  const raw = ui.bookForm.importJson.trim();
  if (!raw) { showToast("请粘贴旧版数据"); return; }
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch {
    showToast("JSON 格式不对");
    return;
  }

  if (parsed?.books) {
    const imported = normalizeState(parsed);
    Object.values(imported.books).forEach(book => {
      const id = state.books[book.id] ? genId() : book.id;
      state.books[id] = { ...book, id, name: `${book.name || "导入账本"}` };
      state.activeBookId = id;
    });
  } else if (legacyHasData(parsed)) {
    state = mergeLegacyIntoStateForced(state, parsed);
  } else {
    showToast("没识别到账单数据");
    return;
  }

  delete state._needsSave;
  ui.bookForm.importJson = "";
  ui.skipBookInputSync = true;
  ensureFormForBook();
  ui.tab = "books";
  saveState(state);
  showToast("导入成功");
}

// ===== CALCULATOR UI =====
function buildCalc() {
  const c = ui.calc;
  const hasActivity = c.tokens.length > 0 || c.current !== "";
  const liveTotal = hasActivity ? calcTotal() : 0;
  const displayVal = ui.form.amount && !hasActivity
    ? ui.form.amount
    : hasActivity ? String(Math.round(liveTotal * 100) / 100) : "";

  // Build expression string for display
  let exprParts = [];
  c.tokens.forEach(t => {
    if (t.type === 'num') {
      exprParts.push(`<span class="calc-expr-chip">${t.val}</span>`);
    } else {
      exprParts.push(`<span class="calc-op-sym">${t.val}</span>`);
    }
  });
  if (c.current !== "") {
    exprParts.push(`<span class="calc-expr-chip active">${c.current}</span>`);
  }
  const exprHtml = exprParts.join("");

  const displayClass = hasActivity ? "calc-display has-expr" : "calc-display";
  const resultClass = displayVal ? "calc-result has-val" : "calc-result zero";
  const resultText = displayVal || "0.00";

  const hasOp = c.tokens.some(t => t.type === 'op');
  const confirmLabel = hasOp
    ? `= ¥${Math.round(liveTotal*100)/100}`
    : (hasActivity ? `✓ 确认` : "确认金额");

  const keys = [
    { label: "7", key: "7" }, { label: "8", key: "8" }, { label: "9", key: "9" }, { label: "÷", key: "÷", cls: "op" },
    { label: "4", key: "4" }, { label: "5", key: "5" }, { label: "6", key: "6" }, { label: "×", key: "×", cls: "op" },
    { label: "1", key: "1" }, { label: "2", key: "2" }, { label: "3", key: "3" }, { label: "−", key: "-", cls: "op" },
    { label: "0", key: "0" }, { label: ".", key: "." }, { label: "⌫", key: "del", cls: "del" }, { label: "+", key: "+", cls: "op" },
    { label: "C", key: "clear", cls: "clear" }, { label: confirmLabel, key: "confirm", cls: "confirm" },
  ];

  let kHtml = keys.map(k =>
    `<div class="calc-key ${k.cls||""}" onclick="calcKey('${k.key}')">${k.label}</div>`
  ).join("");

  return `<div class="${displayClass}">
    <div class="calc-expr">${exprHtml || '<span style="color:var(--muted);font-size:12px">输入金额，支持 + − × ÷</span>'}</div>
    <div class="${resultClass}">¥${resultText}</div>
  </div>
  <div class="calc-keypad">${kHtml}</div>`;
}

// ===== CALCULATOR =====
function calcEval(tokens) {
  // tokens: array of {type:'num'|'op', val}
  // Two-pass: first handle * and /, then + and -
  if (!tokens.length) return 0;
  // build flat array of nums and ops
  const nums = [], ops = [];
  tokens.forEach(t => {
    if (t.type === 'num') nums.push(t.val);
    else ops.push(t.val);
  });
  // pass 1: * and /
  let i = 0;
  while (i < ops.length) {
    if (ops[i] === '×' || ops[i] === '÷') {
      const a = nums[i], b = nums[i+1];
      const res = ops[i] === '×' ? a * b : (b !== 0 ? a / b : 0);
      nums.splice(i, 2, res);
      ops.splice(i, 1);
    } else { i++; }
  }
  // pass 2: + and -
  let result = nums[0] || 0;
  for (let j = 0; j < ops.length; j++) {
    if (ops[j] === '+') result += nums[j+1];
    else if (ops[j] === '-') result -= nums[j+1];
  }
  return Math.round(result * 10000) / 10000;
}

function calcTotal() {
  const c = ui.calc;
  const tokens = [...c.tokens];
  if (c.current !== "") tokens.push({ type: 'num', val: parseFloat(c.current) || 0 });
  return calcEval(tokens);
}

function calcKey(key) {
  const c = ui.calc;
  const isOp = ['+', '-', '×', '÷'].includes(key);

  if (key === 'del') {
    if (c.current.length > 0) {
      c.current = c.current.slice(0, -1);
    } else if (c.tokens.length > 0) {
      const last = c.tokens[c.tokens.length - 1];
      if (last.type === 'op') {
        c.tokens.pop(); // remove operator, go back to editing prev number
      } else {
        c.tokens.pop();
        c.current = String(last.val);
      }
    }
  } else if (key === 'clear') {
    c.tokens = [];
    c.current = "";
    ui.form.amount = "";
  } else if (isOp) {
    // if we have a current number, push it first
    if (c.current !== "") {
      c.tokens.push({ type: 'num', val: parseFloat(c.current) || 0 });
      c.current = "";
    }
    // replace last op if last token is already an op
    if (c.tokens.length > 0 && c.tokens[c.tokens.length-1].type === 'op') {
      c.tokens[c.tokens.length-1].val = key;
    } else if (c.tokens.length > 0) {
      c.tokens.push({ type: 'op', val: key });
    }
    // if no tokens yet and op is '-', start negative number
    else if (key === '-') {
      c.current = '-';
    }
  } else if (key === 'confirm') {
    if (c.current !== "") {
      c.tokens.push({ type: 'num', val: parseFloat(c.current) || 0 });
      c.current = "";
    }
    // remove trailing op if any
    if (c.tokens.length > 0 && c.tokens[c.tokens.length-1].type === 'op') c.tokens.pop();
    const total = calcEval(c.tokens);
    if (total > 0) {
      ui.form.amount = String(Math.round(total * 100) / 100);
      c.tokens = [];
      c.current = "";
    }
  } else if (key === '.') {
    if (!c.current.includes('.')) {
      c.current = c.current === "" || c.current === "-" ? (c.current + "0.") : c.current + '.';
    }
  } else {
    // digit
    if (c.current === "0") {
      c.current = key;
    } else {
      c.current += key;
    }
  }
  render();
}

function render() {
  ensureFormForBook();
  // Save desc input before wiping DOM
  const descEl = document.getElementById("descInput");
  if (descEl) ui.form.desc = descEl.value;
  if (ui.skipBookInputSync) {
    ui.skipBookInputSync = false;
  } else {
    syncBookInputs();
  }

  document.getElementById("app").innerHTML = buildApp();

  // Restore desc value after DOM rebuild
  const newDesc = document.getElementById("descInput");
  if (newDesc) newDesc.value = ui.form.desc;
  const newBookName = document.getElementById("newBookName");
  if (newBookName) newBookName.value = ui.bookForm.name;
  const rename = document.getElementById("renameBookInput");
  if (rename) rename.value = ui.bookForm.rename || activeBook().name;
  const memberName = document.getElementById("newMemberName");
  if (memberName) memberName.value = ui.bookForm.memberName;
  const memberAvatar = document.getElementById("newMemberAvatar");
  if (memberAvatar) memberAvatar.value = ui.bookForm.memberAvatar;
  const importJson = document.getElementById("importLegacyJson");
  if (importJson) importJson.value = ui.bookForm.importJson;
}

      const pct = total > 0 ? (catTotal/total*100).toFixed(0) : 0;
      h += `<div class="stat-bar-row">
        <div class="stat-bar-label"><span>${c.label}</span><span>${fmt(catTotal)}</span></div>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:var(--accent)"></div></div>
      </div>`;
    });
    if (!total) h += `<div style="color:var(--muted);font-size:13px;text-align:center;padding:12px 0">暂无数据</div>`;
    h += `</div>`;
  }

  // ══ TAB: BOOKS ══
  if (ui.tab === "books") {
    h += `<div class="add-form">
      <div class="form-title">📒 当前账本</div>
      <button class="mini-btn primary" style="width:100%;margin-bottom:14px" onclick="ui.bookDrawerOpen=true;render()">切换 / 新建账本</button>
      <div class="form-row">
        <div class="form-label">当前账本名</div>
        <div class="compact-input-row">
          <input class="form-input" id="renameBookInput" type="text" value="${esc(book.name)}">
          <button class="mini-btn" onclick="renameCurrentBook()">保存</button>
        </div>
      </div>
      <button class="mini-btn danger" style="width:100%" onclick="deleteCurrentBook()">删除当前账本</button>
      <button class="mini-btn" style="width:100%;margin-top:8px" onclick="restoreLegacyBook()">恢复旧版账本</button>
      <div class="form-row" style="margin-top:14px;margin-bottom:0">
        <div class="form-label">粘贴旧版数据</div>
        <textarea class="import-textarea" id="importLegacyJson" placeholder='在旧版页面控制台运行：copy(localStorage.getItem("squad_aa"))，再粘贴到这里'></textarea>
        <button class="mini-btn primary" style="width:100%;margin-top:8px" onclick="importLegacyJson()">导入粘贴数据</button>
      </div>
    </div>`;

    h += `<div class="add-form">
      <div class="form-title">成员管理</div>`;
    members.forEach(m => {
      const locked = memberInUse(m.id);
      const avatarDraft = ui.memberDrafts[`${m.id}:avatar`] ?? m.avatar;
      const nameDraft = ui.memberDrafts[`${m.id}:name`] ?? m.name;
      h += `<div class="member-editor-row">
        <input class="form-input avatar-input" value="${esc(avatarDraft)}" maxlength="4"
          oninput="ui.memberDrafts['${m.id}:avatar']=this.value"
          onkeydown="if(event.key==='Enter')this.blur()"
          onchange="updateMember('${m.id}','avatar',this.value)"
          onblur="updateMember('${m.id}','avatar',this.value)">
        <input class="form-input" value="${esc(nameDraft)}"
          oninput="ui.memberDrafts['${m.id}:name']=this.value"
          onkeydown="if(event.key==='Enter')this.blur()"
          onchange="updateMember('${m.id}','name',this.value)"
          onblur="updateMember('${m.id}','name',this.value)">
        <button class="mini-btn danger" onclick="deleteMember('${m.id}')" ${locked ? "disabled" : ""}>删除</button>
      </div>`;
    });

    h += `<div class="form-row" style="margin-top:16px">
        <div class="form-label">添加成员</div>
        <div class="member-editor-row" style="border-bottom:none;padding-bottom:0">
          <input class="form-input avatar-input" id="newMemberAvatar" maxlength="4" placeholder="😀">
          <input class="form-input" id="newMemberName" placeholder="成员名">
          <button class="mini-btn primary" onclick="addMemberFromInput()">添加</button>
        </div>
        <div class="avatar-picks">`;
    AVATAR_PRESETS.forEach(a => {
      h += `<div class="avatar-pick" onclick="ui.bookForm.memberAvatar='${a}';render()">${a}</div>`;
    });
    h += `</div>
      </div>
    </div>`;
  }

  h += `</div>`;
  return h;
}

// ===== INIT =====
render();
async function init() {
  const doInit = async () => {
    const loaded = await loadFromFirebase();
    const needsSave = !!loaded?._needsSave;
    state = normalizeState(loaded);
    ensureFormForBook();
    ui.syncStatus = "idle";
    render();
    if (needsSave) saveState(state);
    startRealtimeSync();
  };
  if (window._fb?.disabled) {
    const savedBooks = JSON.parse(localStorage.getItem("squad_aa_books") || "null");
    const legacyLocal = JSON.parse(localStorage.getItem("squad_aa") || "null");
    state = savedBooks ? mergeLegacyIntoState(savedBooks, legacyLocal) : normalizeState(legacyLocal);
    const savedActive = localStorage.getItem("squad_aa_active_book");
    if (savedActive && state.books[savedActive]) state.activeBookId = savedActive;
    ensureFormForBook();
    ui.syncStatus = "idle";
    render();
    if (state._needsSave) saveState(state);
  } else if (window._fb?.ready) {
    await doInit();
  } else {
    // Timeout: if Firebase SDK doesn't load in 6s, fall back to localStorage
    const timer = setTimeout(async () => {
      console.warn("Firebase SDK load timeout, using localStorage");
      const savedBooks = JSON.parse(localStorage.getItem("squad_aa_books") || "null");
      const legacyLocal = JSON.parse(localStorage.getItem("squad_aa") || "null");
      state = savedBooks ? mergeLegacyIntoState(savedBooks, legacyLocal) : normalizeState(legacyLocal);
      const savedActive = localStorage.getItem("squad_aa_active_book");
      if (savedActive && state.books[savedActive]) state.activeBookId = savedActive;
      ensureFormForBook();
      ui.syncStatus = "idle";
      render();
      if (state._needsSave) saveState(state);
    }, 6000);
    document.addEventListener("firebase-ready", async () => {
      clearTimeout(timer);
      await doInit();
    }, { once: true });
  }
}
init();
</script>
</body>
</html>
