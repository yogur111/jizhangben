<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>分账本 💸</title>
  <style>
    @font-face {
      font-family: 'Noto Sans SC';
      src: local('PingFang SC'), local('Microsoft YaHei'), local('Helvetica Neue');
    }
  </style>

  <!-- Firebase SDK -->

    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmZrMO9O86PXYLNNC7D7GacIhgtXSoQf8",
      authDomain: "jianfei-2744b.firebaseapp.com",
      databaseURL: "https://jianfei-2744b-default-rtdb.firebaseio.com",
      projectId: "jianfei-2744b",

    document.dispatchEvent(new Event("firebase-ready"));
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }

    :root {
      --font: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      --bg: #0C0C10;
      --surface: #141418;
      --surface2: #1C1C22;
      --border: rgba(255,255,255,0.08);
      --accent: #C8F060;
      --accent2: #60C8F0;
      --accent3: #F060A8;
      --text: #F0F0F0;
      --muted: #666;
      --dan: #FF6B6B;
      --li: #4ECDC4;
      --ruan: #FFE66D;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overscroll-behavior: none;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    #app::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.5;
    }

    /* ── SYNC BAR ── */
    .sync-bar {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      max-width: 430px; width: 100%; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; padding: 7px 16px; font-size: 12px; font-weight: 600;
      transition: all 0.3s; font-family: var(--font);
      letter-spacing: 0.03em;
    }
    .sync-bar.loading { background: #1a1a22; color: #555; }
    .sync-bar.saving  { background: #2a2400; color: #FFE66D; border-bottom: 1px solid #FFE66D44; }
    .sync-bar.saved   { background: #0a2214; color: var(--accent); border-bottom: 1px solid var(--accent)44; }
    .sync-bar.synced  { background: #0a1a2a; color: var(--accent2); border-bottom: 1px solid var(--accent2)44; }
    .sync-bar.error   { background: #2a0a0a; color: #FF6B6B; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 1s linear infinite; }

    /* ── HEADER ── */
    .header {
      padding: 56px 24px 0;
      position: relative; z-index: 1;
    }
    .header-top {
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .header-eyebrow {
      font-size: 11px; letter-spacing: 0.15em; color: var(--muted);
      text-transform: uppercase; margin-bottom: 6px;
    }
    .header-title {
      font-size: 28px; font-weight: 800; line-height: 1;
      letter-spacing: -0.03em;
    }
    .header-title span { color: var(--accent); }
    .header-right {
      display: flex; gap: 6px; margin-top: 2px;
    }
    .header-btn {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .header-btn:active { background: var(--surface2); }

    /* ── BOOK SWITCHER ── */
    .book-name-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px 5px 10px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; margin-top: 10px;
      max-width: 200px;
    }
    .book-name-btn:active { background: var(--surface2); }
    .book-name-label {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .book-name-arrow { color: var(--muted); font-size: 10px; }

    /* ── BALANCE STRIP ── */
    .balance-strip {
      display: grid; gap: 10px; margin: 20px 24px 0;
      position: relative; z-index: 1;
    }
    .balance-card {
      border-radius: 16px; padding: 14px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      position: relative; overflow: hidden;
      transition: transform 0.15s;
    }
    .balance-card::before {
      content: '';
      position: absolute; top: -30px; right: -20px;
      width: 80px; height: 80px; border-radius: 50%;
      opacity: 0.12;
    }
    .balance-avatar { font-size: 22px; }
    .balance-name { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; }
    .balance-amt {
      font-size: 18px; font-weight: 800; margin-top: 6px; line-height: 1;
    }
    .balance-amt.positive { color: var(--accent); }
    .balance-amt.negative { color: #FF6B6B; }
    .balance-amt.zero     { color: var(--muted); }
    .balance-label { font-size: 10px; color: var(--muted); margin-top: 3px; }

    /* ── NAV ── */
    .nav {
      display: flex; gap: 4px;
      margin: 20px 24px 0;
      background: var(--surface);
      border-radius: 14px; padding: 4px;
      position: relative; z-index: 1;
      border: 1px solid var(--border);
    }
    .nav-btn {
      flex: 1; background: transparent; border: none;
      border-radius: 10px; padding: 9px 4px;
      cursor: pointer; color: var(--muted);
      font-size: 11px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      transition: all 0.2s; font-family: var(--font);
    }
    .nav-btn.active {
      background: var(--surface2);
      color: var(--text);
    }
    .nav-icon { font-size: 15px; }

    /* ── CONTENT ── */
    .content { padding: 16px 24px 100px; position: relative; z-index: 1; }

    .section-title {
      font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ── ADD FORM ── */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 20px;
      margin-bottom: 20px;
    }
    .form-title {
      font-size: 16px; font-weight: 800;
      margin-bottom: 16px; letter-spacing: -0.02em;
    }
    .form-row { margin-bottom: 14px; }
    .form-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.05em; }
    .form-input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; color: var(--text); font-size: 15px;
      font-family: var(--font); outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--accent); }

    .cat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-pill {
      padding: 6px 14px; border-radius: 20px; font-size: 12px;
      font-weight: 600; cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted); transition: all 0.15s;
    }
    .cat-pill.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .payer-grid { display: grid; gap: 8px; }
    .payer-btn {
      border-radius: 12px; padding: 10px 8px; text-align: center;
      cursor: pointer; border: 1.5px solid var(--border);
      background: var(--surface2); transition: all 0.15s;
    }
    .payer-btn.active { border-color: var(--accent); background: rgba(200,240,96,0.1); }
    .payer-btn-avatar { font-size: 20px; }
    .payer-btn-name { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .payer-btn.active .payer-btn-name { color: var(--accent); }

    .split-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .split-btn {
      border-radius: 10px; padding: 9px; text-align: center;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); font-size: 12px; font-weight: 600;
      color: var(--muted); transition: all 0.15s;
    }
    .split-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(96,200,240,0.08); }

    .participant-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .participant-row:last-child { border-bottom: none; }
    .participant-left { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
    .participant-check {
      width: 22px; height: 22px; border-radius: 8px;
      border: 1.5px solid var(--border); background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: all 0.15s; font-size: 13px;
    }
    .participant-check.checked { background: var(--accent); border-color: var(--accent); color: #000; }
    .participant-custom-amt {
      width: 80px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; color: var(--text);
      font-size: 14px; font-family: var(--font); font-weight: 600;
      outline: none; text-align: right;
    }
    .participant-custom-amt:focus { border-color: var(--accent2); }
    .participant-share { font-size: 14px; font-weight: 700; color: var(--accent); }

    .submit-btn {
      width: 100%; padding: 14px; border-radius: 14px;
      background: var(--accent); color: #000; border: none;
      font-size: 15px; font-weight: 800; cursor: pointer;
      font-family: var(--font); letter-spacing: 0.02em;
      transition: all 0.15s; margin-top: 4px;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }

    /* ── BILL LIST ── */
    .bill-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 14px 16px;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 12px;
      animation: slideIn 0.25s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .bill-cat-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .bill-info { flex: 1; min-width: 0; }
    .bill-desc { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bill-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .bill-right { text-align: right; flex-shrink: 0; }
    .bill-amt { font-size: 16px; font-weight: 800; }
    .bill-payer { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .bill-delete {
      width: 28px; height: 28px; border-radius: 8px;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .bill-delete:active { background: rgba(255,80,80,0.2); border-color: #FF6B6B; color: #FF6B6B; }

    /* ── SETTLE ── */
    .settle-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 16px;
      margin-bottom: 10px;
    }
    .settle-arrow {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600;
    }
    .settle-name { padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; }
    .settle-amt {
      font-size: 20px; font-weight: 800; color: var(--accent);
      margin: 8px 0 4px; letter-spacing: -0.02em;
    }
    .settle-btn {
      padding: 8px 16px; border-radius: 10px;
      background: rgba(200,240,96,0.12); border: 1px solid rgba(200,240,96,0.3);
      color: var(--accent); font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: var(--font);
      transition: all 0.15s; margin-top: 8px;
    }
    .settle-btn:active { background: rgba(200,240,96,0.25); }
    .settled-log {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--muted);
    }
    .settled-log:last-child { border-bottom: none; }

    /* ── STATS ── */
    .stat-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 16px 18px;
      margin-bottom: 10px;
    }
    .stat-member-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .stat-bar-row { margin-bottom: 8px; }
    .stat-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--muted); }
    .stat-bar-track { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--accent);
      color: var(--accent); border-radius: 12px; padding: 10px 20px;
      font-size: 13px; font-weight: 700; z-index: 2000;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
      white-space: nowrap;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-sheet {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      border: 1px solid var(--border);
      padding: 24px 24px 40px;
      width: 100%; max-width: 430px;
      animation: sheetUp 0.35s cubic-bezier(0.34,1.2,0.64,1);
      max-height: 90vh; overflow-y: auto;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle {
      width: 40px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 20px;
    }
    .modal-title {
      font-size: 18px; font-weight: 800; margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    /* ── BOOK LIST (in modal) ── */
    .book-list-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface2); margin-bottom: 8px;
      transition: all 0.15s;
    }
    .book-list-item.current {
      border-color: var(--accent);
      background: rgba(200,240,96,0.06);
    }
    .book-list-info { flex: 1; min-width: 0; }
    .book-list-name {
      font-size: 15px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .book-list-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .book-list-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .book-list-btn {
      padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      transition: all 0.15s;
    }
    .book-list-btn:active { background: var(--surface); }
    .book-list-btn.primary {
      background: rgba(200,240,96,0.12); border-color: rgba(200,240,96,0.3); color: var(--accent);
    }
    .book-list-btn.danger { color: #FF6B6B; border-color: rgba(255,80,80,0.3); }

    .create-book-btn {
      width: 100%; padding: 14px; border-radius: 14px;
      background: var(--accent); color: #000; border: none;
      font-size: 14px; font-weight: 800; cursor: pointer;
      font-family: var(--font); margin-top: 12px;
      transition: all 0.15s;
    }
    .create-book-btn:active { transform: scale(0.98); }

    /* ── MEMBER MGMT ── */
    .member-mgmt-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .member-mgmt-item:last-child { border-bottom: none; }
    .member-mgmt-avatar { font-size: 26px; }
    .member-mgmt-info { flex: 1; }
    .member-mgmt-name { font-size: 14px; font-weight: 600; }
    .member-mgmt-id { font-size: 11px; color: var(--muted); }
    .member-mgmt-actions { display: flex; gap: 6px; }
    .member-action-btn {
      width: 30px; height: 30px; border-radius: 8px;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .member-action-btn:active { background: var(--surface2); }
    .member-action-btn.danger:active { background: rgba(255,80,80,0.15); border-color: #FF6B6B; color: #FF6B6B; }

    .add-member-form {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-top: 14px;
    }
    .add-member-form-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
    .avatar-picker {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .avatar-option {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--surface); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; transition: all 0.15s;
    }
    .avatar-option.selected { border-color: var(--accent); background: rgba(200,240,96,0.1); }
    .add-member-row {
      display: flex; gap: 8px; align-items: flex-end;
    }
    .add-member-input {
      flex: 1; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; color: var(--text); font-size: 14px;
      font-family: var(--font); outline: none;
    }
    .add-member-input:focus { border-color: var(--accent); }
    .add-member-submit {
      padding: 10px 16px; border-radius: 10px;
      background: var(--accent); color: #000; border: none;
      font-size: 13px; font-weight: 700; cursor: pointer;
      font-family: var(--font); white-space: nowrap;
    }
    .add-member-submit:active { transform: scale(0.96); }

    /* ── CALCULATOR ── */
    .calc-display {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; color: var(--text);
      font-family: var(--font); outline: none;
      transition: border-color 0.2s;
      min-height: 58px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .calc-display.has-expr { border-color: var(--accent2); }
    .calc-expr {
      font-size: 13px; color: var(--accent2); font-weight: 600;
      letter-spacing: 0.02em; min-height: 18px;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .calc-expr-chip {
      background: rgba(96,200,240,0.12); border: 1px solid rgba(96,200,240,0.25);
      border-radius: 6px; padding: 1px 7px; font-size: 12px;
    }
    .calc-expr-chip.active {
      background: rgba(200,240,96,0.1); border-color: rgba(200,240,96,0.35); color: var(--accent);
    }
    .calc-op-sym {
      color: var(--accent2); font-size: 14px; font-weight: 800; padding: 0 2px;
    }
    .calc-result {
      font-size: 26px; font-weight: 800; line-height: 1.1;
    }
    .calc-result.zero { color: var(--muted); }
    .calc-result.has-val { color: var(--text); }
    .calc-keypad {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-top: 10px;
    }
    .calc-key {
      border-radius: 12px; padding: 14px 4px;
      text-align: center; cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      font-size: 17px; font-weight: 700;
      color: var(--text); transition: all 0.1s;
      user-select: none; font-family: var(--font);
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .calc-key:active { transform: scale(0.94); background: var(--surface); }
    .calc-key.op { color: var(--accent2); background: rgba(96,200,240,0.06); }
    .calc-key.op:active { background: rgba(96,200,240,0.18); }
    .calc-key.del { color: #FF9999; font-size: 19px; }
    .calc-key.confirm {
      grid-column: span 3;
      background: var(--accent); color: #000;
      border-color: var(--accent); font-size: 15px;
    }
    .calc-key.confirm:active { background: #a8d040; }
    .calc-key.clear { color: var(--dan); background: rgba(255,107,107,0.06); }
    .calc-key.clear:active { background: rgba(255,107,107,0.18); }

    .loading-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 80vh; gap: 16px;
    }
    .loading-icon { font-size: 52px; animation: pulse 1.5s ease infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* ── INLINE EDIT ── */
    .inline-edit-input {
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 8px; padding: 4px 8px; color: var(--text);
      font-size: 14px; font-family: var(--font); font-weight: 600;
      outline: none; width: 100px;
    }

    /* ── CONFIRM DIALOG ── */
    .confirm-overlay {
      position: fixed; inset: 0; z-index: 600;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .confirm-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px; max-width: 320px; width: 100%;
      text-align: center;
    }
    .confirm-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
    .confirm-msg { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
    .confirm-btns { display: flex; gap: 8px; }
    .confirm-btn {
      flex: 1; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--border); font-family: var(--font);
      transition: all 0.15s;
    }
    .confirm-btn.cancel { background: var(--surface2); color: var(--muted); }
    .confirm-btn.danger { background: rgba(255,80,80,0.15); border-color: rgba(255,80,80,0.3); color: #FF6B6B; }
    .confirm-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ===== CONSTANTS =====
const CATS = [
  { id: "food",  label: "🍜 吃饭", bg: "rgba(255,107,107,0.15)" },
  { id: "drink", label: "🧋 奶茶", bg: "rgba(255,230,109,0.15)" },
  { id: "car",   label: "🚗 打车", bg: "rgba(78,205,196,0.15)"  },
  { id: "shop",  label: "🛍️ 购物", bg: "rgba(167,139,250,0.15)" },
  { id: "other", label: "📦 其他", bg: "rgba(200,200,200,0.1)"  },
];
const CAT_MAP = Object.fromEntries(CATS.map(c => [c.id, c]));

const MEMBER_COLORS = [
  '#FF6B6B','#4ECDC4','#FFE66D','#A78BFA','#F472B6',
  '#60A5FA','#34D399','#FBBF24','#FB923C','#94A3B8'
];

const AVATAR_OPTIONS = [
  '😀','😎','🥚','🦦','🌼','🐱','🐶','🦊','🐼','🐨',
  '🌟','🔥','💎','🎵','🍀','🌈','🎈','🦄','🐙','🍑',
  '🍒','🌸','🎭','🧸','🐸','🐧'
];

const DB_ROOT = "squad_aa_v2";
const OLD_DB_PATH = "squad_aa_v1";
const LS_KEY = "squad_aa_v2";
const OLD_LS_KEY = "squad_aa";

let _isSaving = false;
let _skipNextSync = false;

// ===== BOOKS STATE =====
let books = {};
let currentBookId = null;

function defaultBook(name) {
  return { name: name || '新账本', members: [], bills: [], settled: [] };
}

function getCurrentBook() {
  return books[currentBookId] || defaultBook('空账本');
}

function getCurrentMembers() {
  return getCurrentBook().members || [];
}

// ===== UI STATE =====
let ui = {
  tab: "add",
  syncStatus: "loading",
  toast: null,
  modal: null,
  // New book creation temp state
  newBook: { name: '', members: [{ id: 'm1', name: '成员1', avatar: '😀' }] },
  newMember: { name: '', avatar: '😀' },
  editingMemberId: null,
  editingMemberName: '',
  confirmDialog: null,
  // form
  form: {
    desc: "",
    amount: "",
    cat: "food",
    payer: "",
    splitMode: "equal",
    participants: {},
    customAmts: {},
  },
  // calculator
  calc: { tokens: [], current: "" },
};

function resetFormForCurrentBook() {
  const members = getCurrentMembers();
  const participants = {};
  const customAmts = {};
  members.forEach(m => { participants[m.id] = true; customAmts[m.id] = ""; });
  ui.form = {
    desc: "", amount: "", cat: "food",
    payer: members.length ? members[0].id : "",
    splitMode: "equal",
    participants, customAmts,
  };
  ui.calc = { tokens: [], current: "" };
}

// ===== FIREBASE =====
function saveBooks() {
  const data = { currentBookId, books };
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {}
  if (window._fb?.ready) {
    _isSaving = true;
    ui.syncStatus = "saving";
    render();
    window._fb.set(window._fb.ref(window._fb.db, DB_ROOT), {
      ...data, _updatedAt: Date.now()
    }).then(() => {
      _isSaving = false;
      ui.syncStatus = "saved";
      render();
      setTimeout(() => { if (ui.syncStatus === "saved") { ui.syncStatus = "idle"; render(); } }, 2500);
    }).catch(() => {
      _isSaving = false;
      ui.syncStatus = "error";
      render();
    });
  }
}

function startRealtimeSync() {
  if (!window._fb?.ready) return;
  let firstCallback = true;
  window._fb.onValue(window._fb.ref(window._fb.db, DB_ROOT), (snap) => {
    if (firstCallback) { firstCallback = false; return; }
    if (_isSaving || _skipNextSync) { _skipNextSync = false; return; }
    if (snap.exists()) {
      const d = snap.val();
      if (d.books) {
        books = d.books;
        currentBookId = d.currentBookId;
        ui.syncStatus = "synced";
        resetFormForCurrentBook();
        render();
        setTimeout(() => { if (ui.syncStatus === "synced") { ui.syncStatus = "idle"; render(); } }, 2000);
      }
    }
  });
}

async function loadFromFirebase() {
  if (window._fb?.ready) {
    try {
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 5000));
      const snap = await Promise.race([
        window._fb.get(window._fb.ref(window._fb.db, DB_ROOT)),
        timeout
      ]);
      if (snap.exists()) {
        const d = snap.val();
        if (d.books) {
          books = d.books;
          currentBookId = d.currentBookId;
          return;
        }
      }
    } catch (e) { console.warn("Firebase load failed:", e.message); }
  }
  // Fallback to localStorage
  try {
    const stored = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (stored && stored.books) {
      books = stored.books;
      currentBookId = stored.currentBookId;
      return;
    }
  } catch {}
  // Nothing found — will trigger migration or fresh start
}

async function migrateOldData() {
  let oldBills = [], oldSettled = [];
  let hasOldData = false;

  // Check old Firebase path
  if (window._fb?.ready) {
    try {
      const snap = await window._fb.get(window._fb.ref(window._fb.db, OLD_DB_PATH));
      if (snap.exists()) {
        const d = snap.val();
        oldBills = d.bills || [];
        oldSettled = d.settled || [];
        hasOldData = true;
        // Remove old path
        window._fb.set(window._fb.ref(window._fb.db, OLD_DB_PATH), null);
      }
    } catch {}
  }

  // Check old localStorage
  if (!hasOldData) {
    try {
      const old = JSON.parse(localStorage.getItem(OLD_LS_KEY) || "null");
      if (old && (old.bills?.length || old.settled?.length)) {
        oldBills = old.bills || [];
        oldSettled = old.settled || [];
        hasOldData = true;
        localStorage.removeItem(OLD_LS_KEY);
      }
    } catch {}
  }

  if (hasOldData && Object.keys(books).length === 0) {
    const defaultBookId = genId();
    books[defaultBookId] = {
      name: '小分队分账',
      members: [
        { id: "dan",  name: "蛋总", avatar: "🥚" },
        { id: "li",   name: "丽总", avatar: "🦦" },
        { id: "ruan", name: "小阮", avatar: "🌼" },
      ],
      bills: oldBills,
      settled: oldSettled,
    };
    currentBookId = defaultBookId;
    saveBooks();
  }

  // If still no books, create a fresh default one
  if (Object.keys(books).length === 0) {
    const defaultBookId = genId();
    books[defaultBookId] = {
      name: '默认账本',
      members: [
        { id: "m1", name: "成员1", avatar: "😀" },
        { id: "m2", name: "成员2", avatar: "😎" },
      ],
      bills: [],
      settled: [],
    };
    currentBookId = defaultBookId;
    saveBooks();
  }

  if (!currentBookId || !books[currentBookId]) {
    currentBookId = Object.keys(books)[0];
  }
}

// ===== HELPERS =====
function getToday() { return new Date().toLocaleDateString("zh-CN", { month:"numeric", day:"numeric" }); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fmt(n) { return "¥" + Number(n).toFixed(2); }
function memberById(id) { return getCurrentMembers().find(m => m.id === id); }
function getMemberColor(index) { return MEMBER_COLORS[index % MEMBER_COLORS.length]; }

// ===== COMPUTE BALANCES =====
function computeBalances() {
  const members = getCurrentMembers();
  const bal = {};
  members.forEach(m => { bal[m.id] = 0; });
  const book = getCurrentBook();
  (book.bills || []).forEach(b => {
    if (bal[b.payer] !== undefined) bal[b.payer] += b.amount;
    Object.entries(b.splits || {}).forEach(([id, amt]) => {
      if (bal[id] !== undefined) bal[id] -= amt;
    });
  });
  (book.settled || []).forEach(s => {
    if (bal[s.from] !== undefined) bal[s.from] += s.amount;
    if (bal[s.to] !== undefined) bal[s.to] -= s.amount;
  });
  return bal;
}

function computeSettlements(bal) {
  const debtors  = Object.entries(bal).filter(([,v]) => v < -0.01).map(([k,v]) => ({ id:k, amt:-v }));
  const creditors= Object.entries(bal).filter(([,v]) => v >  0.01).map(([k,v]) => ({ id:k, amt:v }));
  const txns = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    txns.push({ from: debtors[i].id, to: creditors[j].id, amount: Math.round(pay * 100) / 100 });
    debtors[i].amt  -= pay;
    creditors[j].amt -= pay;
    if (debtors[i].amt  < 0.01) i++;
    if (creditors[j].amt < 0.01) j++;
  }
  return txns;
}

// ===== FORM LOGIC =====
function formSplits() {
  const f = ui.form;
  const amt = parseFloat(f.amount) || (ui.calc.tokens.length > 0 || ui.calc.current ? calcTotal() : 0);
  const participants = Object.entries(f.participants).filter(([,v]) => v).map(([k]) => k);
  if (!participants.length) return {};
  if (f.splitMode === "equal") {
    const share = Math.round(amt / participants.length * 100) / 100;
    const splits = {};
    let total = 0;
    participants.forEach((id, i) => {
      if (i === participants.length - 1) {
        splits[id] = Math.round((amt - total) * 100) / 100;
      } else { splits[id] = share; total += share; }
    });
    return splits;
  } else {
    const splits = {};
    participants.forEach(id => { splits[id] = parseFloat(f.customAmts[id]) || 0; });
    return splits;
  }
}

function formValid() {
  const f = ui.form;
  const amt = parseFloat(f.amount) || (ui.calc.tokens.length > 0 || ui.calc.current ? calcTotal() : 0);
  if (!f.desc.trim() || !amt || amt <= 0) return false;
  if (!Object.values(f.participants).filter(Boolean).length) return false;
  if (f.splitMode === "custom") {
    const splits = formSplits();
    const total = Object.values(splits).reduce((s,v) => s+v, 0);
    if (Math.abs(total - amt) > 0.01) return false;
  }
  return true;
}

// ===== ACTIONS =====
function syncInputsNow() {
  const descEl = document.getElementById("descInput");
  if (descEl) ui.form.desc = descEl.value;
  if (ui.calc.current !== "" || ui.calc.tokens.length > 0) {
    calcKey('confirm');
  }
}

function syncInputsAndAdd() {
  syncInputsNow();
  setTimeout(() => {
    if (!formValid()) {
      const f = ui.form;
      const amt = parseFloat(f.amount);
      if (!f.desc.trim()) { showToast("请填写描述"); return; }
      if (!amt || amt <= 0) { showToast("请填写金额"); return; }
      showToast("请检查分摊金额");
      return;
    }
    addBill();
  }, 10);
}

function addBill() {
  if (ui.calc.tokens.length > 0 || ui.calc.current !== "") {
    const total = calcTotal();
    if (total > 0) {
      ui.form.amount = String(Math.round(total * 100) / 100);
      ui.calc.tokens = [];
      ui.calc.current = "";
    }
  }
  if (!formValid()) return;
  const f = ui.form;
  const splits = formSplits();
  const bill = {
    id: genId(), desc: f.desc.trim(),
    amount: parseFloat(f.amount), cat: f.cat,
    payer: f.payer, splits, date: getToday(), ts: Date.now(),
  };
  const book = getCurrentBook();
  book.bills.push(bill);
  saveBooks();
  ui.form.desc = "";
  ui.form.amount = "";
  ui.calc = { tokens: [], current: "" };
  showToast("✅ 记账成功！");
  setTimeout(() => { ui.tab = "bills"; render(); }, 300);
}

function deleteBill(id) {
  const book = getCurrentBook();
  book.bills = book.bills.filter(b => b.id !== id);
  saveBooks();
  showToast("🗑️ 已删除");
}

function settleUp(from, to, amount) {
  const book = getCurrentBook();
  book.settled.push({ id: genId(), from, to, amount, date: getToday(), ts: Date.now() });
  saveBooks();
  const fromM = memberById(from), toM = memberById(to);
  showToast(`💸 ${fromM?.name || '?'} → ${toM?.name || '?'} ¥${amount.toFixed(2)}`);
}

function showToast(msg) {
  ui.toast = msg;
  render();
  setTimeout(() => { ui.toast = null; render(); }, 2200);
}

// ===== BOOK ACTIONS =====
function createBook(name, members) {
  const id = genId();
  books[id] = { name: name || '新账本', members: members || [], bills: [], settled: [] };
  currentBookId = id;
  saveBooks();
  resetFormForCurrentBook();
  ui.modal = null;
  ui.tab = "add";
  render();
  showToast(`📖 已创建「${name}」`);
}

function switchBook(id) {
  if (id === currentBookId) return;
  currentBookId = id;
  saveBooks();
  resetFormForCurrentBook();
  ui.modal = null;
  ui.tab = "add";
  render();
  const book = getCurrentBook();
  showToast(`📖 已切换到「${book.name}」`);
}

function deleteBook(id) {
  const book = books[id];
  if (!book) return;
  const bookCount = Object.keys(books).length;
  if (bookCount <= 1) {
    showToast("至少保留一个账本");
    return;
  }
  ui.confirmDialog = {
    title: '删除账本',
    msg: `确定删除「${book.name}」吗？该账本有 ${(book.bills||[]).length} 条账单，删除后无法恢复。`,
    onConfirm: () => {
      delete books[id];
      if (currentBookId === id) {
        currentBookId = Object.keys(books)[0];
        resetFormForCurrentBook();
      }
      saveBooks();
      ui.confirmDialog = null;
      ui.modal = 'manageBooks';
      render();
      showToast("🗑️ 已删除");
    }
  };
  render();
}

function renameBook(id, newName) {
  if (!newName.trim()) return;
  books[id].name = newName.trim();
  saveBooks();
  render();
}

// ===== MEMBER ACTIONS =====
function addMemberToBook(name, avatar) {
  // Sync from DOM input in case oninput hasn't fired
  const nameInput = document.querySelector('.add-member-input');
  if (nameInput && nameInput.value) name = nameInput.value;
  if (!name || !name.trim()) return;
  const book = getCurrentBook();
  const id = 'm' + genId().slice(0, 6);
  book.members.push({ id, name: name.trim(), avatar: avatar || '😀' });
  saveBooks();
  // Update form state
  ui.form.participants[id] = true;
  ui.form.customAmts[id] = "";
  if (!ui.form.payer) ui.form.payer = id;
  ui.newMember = { name: '', avatar: '😀' };
  render();
  showToast(`已添加 ${name}`);
}

function deleteMember(memberId) {
  const book = getCurrentBook();
  if (book.members.length <= 2) {
    showToast("账本至少保留2个成员");
    return;
  }
  const member = book.members.find(m => m.id === memberId);
  ui.confirmDialog = {
    title: '移除成员',
    msg: `确定移除「${member?.name}」吗？已有账单中的记录不会被删除。`,
    onConfirm: () => {
      book.members = book.members.filter(m => m.id !== memberId);
      delete ui.form.participants[memberId];
      delete ui.form.customAmts[memberId];
      if (ui.form.payer === memberId) {
        ui.form.payer = book.members[0]?.id || "";
      }
      saveBooks();
      ui.confirmDialog = null;
      ui.modal = 'manageMembers';
      render();
      showToast("已移除");
    }
  };
  render();
}

function saveMemberEdit(memberId) {
  const book = getCurrentBook();
  const member = book.members.find(m => m.id === memberId);
  if (member && ui.editingMemberName.trim()) {
    member.name = ui.editingMemberName.trim();
    saveBooks();
  }
  ui.editingMemberId = null;
  ui.editingMemberName = '';
  render();
}

function changeMemberAvatar(memberId, avatar) {
  const book = getCurrentBook();
  const member = book.members.find(m => m.id === memberId);
  if (member) { member.avatar = avatar; saveBooks(); render(); }
}

// ===== NEW BOOK HELPERS =====
function addMemberToNewBook() {
  const nb = ui.newBook;
  if (!nb.name.trim() && nb.members.length === 0) {
    showToast("请先填写账本名称");
    return;
  }
  // Sync name from DOM input
  const nameInput = document.querySelector('.add-member-input');
  if (nameInput && nameInput.value) ui.newMember.name = nameInput.value;
  const m = ui.newMember;
  if (!m.name.trim()) { showToast("请填写成员名称"); return; }
  nb.members.push({ id: 'nm' + genId().slice(0, 5), name: m.name.trim(), avatar: m.avatar });
  ui.newMember = { name: '', avatar: m.avatar };
  render();
}

function removeMemberFromNewBook(index) {
  if (ui.newBook.members.length <= 0) return;
  ui.newBook.members.splice(index, 1);
  render();
}

function submitNewBook() {
  // Sync book name from DOM input
  const nameInput = document.querySelector('.modal-sheet .form-input');
  if (nameInput && nameInput.value) ui.newBook.name = nameInput.value;
  const nb = ui.newBook;
  if (!nb.name.trim()) { showToast("请填写账本名称"); return; }
  if (nb.members.length < 2) { showToast("至少添加2个成员"); return; }
  const members = nb.members.map(m => ({
    id: 'm' + genId().slice(0, 6), name: m.name, avatar: m.avatar
  }));
  createBook(nb.name.trim(), members);
  ui.newBook = { name: '', members: [] };
  ui.newMember = { name: '', avatar: '😀' };
}

// ===== CALCULATOR =====
function calcEval(tokens) {
  if (!tokens.length) return 0;
  const nums = [], ops = [];
  tokens.forEach(t => {
    if (t.type === 'num') nums.push(t.val);
    else ops.push(t.val);
  });
  let i = 0;
  while (i < ops.length) {
    if (ops[i] === '×' || ops[i] === '÷') {
      const a = nums[i], b = nums[i+1];
      const res = ops[i] === '×' ? a * b : (b !== 0 ? a / b : 0);
      nums.splice(i, 2, res);
      ops.splice(i, 1);
    } else { i++; }
  }
  let result = nums[0] || 0;
  for (let j = 0; j < ops.length; j++) {
    if (ops[j] === '+') result += nums[j+1];
    else if (ops[j] === '-') result -= nums[j+1];
  }
  return Math.round(result * 10000) / 10000;
}

function calcTotal() {
  const c = ui.calc;
  const tokens = [...c.tokens];
  if (c.current !== "") tokens.push({ type: 'num', val: parseFloat(c.current) || 0 });
  return calcEval(tokens);
}

function calcKey(key) {
  const c = ui.calc;
  const isOp = ['+', '-', '×', '÷'].includes(key);

  if (key === 'del') {
    if (c.current.length > 0) {
      c.current = c.current.slice(0, -1);
    } else if (c.tokens.length > 0) {
      const last = c.tokens[c.tokens.length - 1];
      if (last.type === 'op') { c.tokens.pop(); }
      else { c.tokens.pop(); c.current = String(last.val); }
    }
  } else if (key === 'clear') {
    c.tokens = []; c.current = ""; ui.form.amount = "";
  } else if (isOp) {
    if (c.current !== "") { c.tokens.push({ type: 'num', val: parseFloat(c.current) || 0 }); c.current = ""; }
    if (c.tokens.length > 0 && c.tokens[c.tokens.length-1].type === 'op') {
      c.tokens[c.tokens.length-1].val = key;
    } else if (c.tokens.length > 0) {
      c.tokens.push({ type: 'op', val: key });
    } else if (key === '-') {
      c.current = '-';
    }
  } else if (key === 'confirm') {
    if (c.current !== "") { c.tokens.push({ type: 'num', val: parseFloat(c.current) || 0 }); c.current = ""; }
    if (c.tokens.length > 0 && c.tokens[c.tokens.length-1].type === 'op') c.tokens.pop();
    const total = calcEval(c.tokens);
    if (total > 0) {
      ui.form.amount = String(Math.round(total * 100) / 100);
      c.tokens = []; c.current = "";
    }
  } else if (key === '.') {
    if (!c.current.includes('.')) {
      c.current = c.current === "" || c.current === "-" ? (c.current + "0.") : c.current + '.';
    }
  } else {
    if (c.current === "0") { c.current = key; }
    else { c.current += key; }
  }
  render();
}

// ===== BUILD CALCULATOR =====
function buildCalc() {
  const c = ui.calc;
  const hasActivity = c.tokens.length > 0 || c.current !== "";
  const liveTotal = hasActivity ? calcTotal() : 0;
  const displayVal = ui.form.amount && !hasActivity
    ? ui.form.amount
    : hasActivity ? String(Math.round(liveTotal * 100) / 100) : "";

  let exprParts = [];
  c.tokens.forEach(t => {
    if (t.type === 'num') exprParts.push(`<span class="calc-expr-chip">${t.val}</span>`);
    else exprParts.push(`<span class="calc-op-sym">${t.val}</span>`);
  });
  if (c.current !== "") exprParts.push(`<span class="calc-expr-chip active">${c.current}</span>`);

  const displayClass = hasActivity ? "calc-display has-expr" : "calc-display";
  const resultClass = displayVal ? "calc-result has-val" : "calc-result zero";
  const resultText = displayVal || "0.00";

  const hasOp = c.tokens.some(t => t.type === 'op');
  const confirmLabel = hasOp
    ? `= ¥${Math.round(liveTotal*100)/100}`
    : (hasActivity ? `✓ 确认` : "确认金额");

  const keys = [
    { label: "7", key: "7" }, { label: "8", key: "8" }, { label: "9", key: "9" }, { label: "÷", key: "÷", cls: "op" },
    { label: "4", key: "4" }, { label: "5", key: "5" }, { label: "6", key: "6" }, { label: "×", key: "×", cls: "op" },
    { label: "1", key: "1" }, { label: "2", key: "2" }, { label: "3", key: "3" }, { label: "−", key: "-", cls: "op" },
    { label: "0", key: "0" }, { label: ".", key: "." }, { label: "⌫", key: "del", cls: "del" }, { label: "+", key: "+", cls: "op" },
    { label: "C", key: "clear", cls: "clear" }, { label: confirmLabel, key: "confirm", cls: "confirm" },
  ];

  let kHtml = keys.map(k =>
    `<div class="calc-key ${k.cls||""}" onclick="calcKey('${k.key}')">${k.label}</div>`
  ).join("");

  return `<div class="${displayClass}">
    <div class="calc-expr">${exprParts.join("") || '<span style="color:var(--muted);font-size:12px">输入金额，支持 + − × ÷</span>'}</div>
    <div class="${resultClass}">¥${resultText}</div>
  </div>
  <div class="calc-keypad">${kHtml}</div>`;
}

function buildStatsTab() {
  const book = getCurrentBook();

  let h = `<div class="section-title">消费概览</div>`;
  members.forEach((m, idx) => {
    const paid = bills.filter(b=>b.payer===m.id).reduce((s,b)=>s+b.amount,0);

    const color = getMemberColor(idx);
    h += `<div class="stat-row">

    const pct = total > 0 ? (catTotal/total*100).toFixed(0) : 0;

      <div class="member-mgmt-info">`;
    if (isEditing) {
      h += `<div style="display:flex;gap:6px;align-items:center">
        <input class="inline-edit-input" id="memberEditInput" type="text" value="${ui.editingMemberName}"
          oninput="ui.editingMemberName=this.value"
          onkeydown="if(event.key==='Enter'){saveMemberEdit('${m.id}');}if(event.key==='Escape'){ui.editingMemberId=null;render();}">
        <div class="member-action-btn" onclick="saveMemberEdit('${m.id}')" style="color:var(--accent);border-color:var(--accent)">✓</div>
      </div>`;
    } else {
      h += `<div class="member-mgmt-name">${m.name}</div>`;
    }
    h += `</div>
      <div class="member-mgmt-actions">`;
    if (!isEditing) {
      h += `<div class="member-action-btn" onclick="ui.editingMemberId='${m.id}';ui.editingMemberName='${m.name}';render()">✏️</div>`;
      h += `<div class="member-action-btn danger" onclick="deleteMember('${m.id}')">×</div>`;
    }
    h += `</div></div>`;

    // Avatar picker for editing member
    if (isEditing) {
      h += `<div style="padding:8px 0 4px 38px">
        <div class="form-label">更换头像</div>
        <div class="avatar-picker">`;
      AVATAR_OPTIONS.forEach(a => {
        h += `<div class="avatar-option${m.avatar===a?' selected':''}"
          onclick="changeMemberAvatar('${m.id}','${a}')">${a}</div>`;
      });
      h += `</div></div>`;
    }
  });

  // Add new member
  h += `<div class="add-member-form">
    <div class="add-member-form-title">添加新成员</div>
    <div class="form-label">选择头像</div>
    <div class="avatar-picker">`;
  AVATAR_OPTIONS.forEach(a => {
    h += `<div class="avatar-option${nm.avatar===a?' selected':''}"
      onclick="ui.newMember.avatar='${a}';render()">${a}</div>`;
  });
  h += `</div>
    <div class="add-member-row">
      <input class="add-member-input" type="text" placeholder="成员名称"
        value="${nm.name}"
        oninput="ui.newMember.name=this.value"
        onkeydown="if(event.key==='Enter'){addMemberToBook(ui.newMember.name||this.value, ui.newMember.avatar);}">
      <div class="add-member-submit" onclick="addMemberToBook(ui.newMember.name, ui.newMember.avatar)">+ 添加</div>
    </div>
  </div>`;

  h += `</div></div>`;
  return h;
}

// ===== INIT =====
render();
async function init() {
  const doInit = async () => {
    await loadFromFirebase();
    await migrateOldData();
    resetFormForCurrentBook();
    startRealtimeSync();
    ui.syncStatus = "idle";
    render();
  };
  if (window._fb?.ready) {
    await doInit();
  } else {
    const timer = setTimeout(async () => {
      console.warn("Firebase SDK load timeout, using localStorage");
      try {
        const stored = JSON.parse(localStorage.getItem(LS_KEY) || "null");
        if (stored && stored.books) { books = stored.books; currentBookId = stored.currentBookId; }
      } catch {}
      await migrateOldData();
      resetFormForCurrentBook();
      ui.syncStatus = "idle";
      render();
    }, 6000);
    document.addEventListener("firebase-ready", async () => {
      clearTimeout(timer);
      await doInit();
    }, { once: true });
  }
}
init();
</script>
</body>
</html>
